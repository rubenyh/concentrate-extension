<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Reels &amp; Shorts Blocker</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <h1>Reels &amp; Shorts Blocker</h1>
      <p class="note">Shorts and Reels pages are always blocked.</p>
      <fieldset>
        <legend>Instagram home feed</legend>
        <label><input type="checkbox" name="igHideFeedReels" /> Hide reels</label>
        <label><input type="checkbox" name="igFollowedOnly" /> Only show accounts I follow</label>
      </fieldset>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
