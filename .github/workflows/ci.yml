# Static checks, unit + E2E tests, build and dependency audit for every PR and push to main.
# Runs untrusted PR code only with a read-only token and no secrets (pull_request, not
# pull_request_target). Third-party actions are pinned to full commit SHAs; Dependabot bumps them.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22 # latest 22.x; package.json engines needs >=22.22.2
          cache: npm

      - run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=moderate

      - name: Verify registry signatures
        run: npm audit signatures

      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test

      - run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npm run test:e2e
